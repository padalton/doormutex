name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Licences · REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

  hub-test:
    name: Hub · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: Pull throwaway MQTT broker
        run: docker pull -q eclipse-mosquitto:2
      - name: Test (incl. MQTT integration against Docker)
        env:
          OTL_INTEGRATION: "1"
        run: go test -race -count=1 ./...

  hub-lint:
    name: Hub · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: hub

  hub-docker:
    name: Hub · docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t office-traffic-light-hub:ci hub
      - name: Smoke test
        run: |
          docker run -d --name hub -p 127.0.0.1:8080:8080 office-traffic-light-hub:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs hub; exit 1
