name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Licences · REUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

  hub-test:
    name: Hub · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: Pull throwaway MQTT broker
        run: docker pull -q eclipse-mosquitto:2
      - name: Test (incl. MQTT integration against Docker)
        env:
          DOORMUTEX_INTEGRATION: "1"
        run: go test -race -count=1 ./...

  hub-lint:
    name: Hub · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: hub

  companion:
    name: Companion · test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o /dev/null ./cmd/doormutex-companion
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: companion

  plasmoid:
    name: Plasmoid · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check metadata
        run: python3 -c "import json; m = json.load(open('plasmoid/package/metadata.json')); assert m['KPlugin']['Id'] == 'org.doormutex.trafficlight'"
      - name: Translations are compiled
        run: |
          sudo apt-get install -y -qq gettext >/dev/null
          for mo in plasmoid/package/contents/locale/*/LC_MESSAGES/*.mo; do msgunfmt "$mo" > "$mo.committed"; done
          plasmoid/translate/update.sh compile
          for mo in plasmoid/package/contents/locale/*/LC_MESSAGES/*.mo; do
            msgunfmt "$mo" | diff -u "$mo.committed" - || { echo "::error::$mo is out of date – run plasmoid/translate/update.sh"; exit 1; }
            rm "$mo.committed"
          done
      - name: Pack
        run: cd plasmoid/package && zip -qr ../doormutex.plasmoid .
      - uses: actions/upload-artifact@v4
        with:
          name: doormutex.plasmoid
          path: plasmoid/doormutex.plasmoid

  enclosure:
    name: Enclosure · render
    runs-on: ubuntu-latest
    # Pinned OpenSCAD snapshot with the Manifold backend.
    container: openscad/openscad:dev.2026-10-12
    steps:
      - uses: actions/checkout@v5
      - name: Install a virtual display for the PNG previews
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb xauth >/dev/null
      - name: Render parts, check fits, render previews
        run: xvfb-run -a enclosure/render.sh "$GITHUB_WORKSPACE/enclosure-build"
      - uses: actions/upload-artifact@v4
        with:
          name: enclosure
          path: |
            enclosure-build/*.stl
            enclosure-build/*.png
          if-no-files-found: error

  hub-docker:
    name: Hub · docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t doormutex-hub:ci hub
      - name: Smoke test
        run: |
          docker run -d --name hub -p 127.0.0.1:8080:8080 doormutex-hub:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          TOKEN=$(docker exec hub doormutex-hub token create ci)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/v1/profiles | tee /dev/stderr | grep -q '"id":"office"' \
            || { docker logs hub; exit 1; }
