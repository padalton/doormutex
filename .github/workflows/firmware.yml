name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-test:
    name: Firmware · host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run
        run: |
          cmake -S firmware/test/host -B build/host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure

  idf-build:
    name: Firmware · ESP-IDF build (esp32c6)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py set-target esp32c6 build
          # One image for ESP Web Tools / esptool at offset 0.
          idf.py merge-bin -o doormutex-esp32c6-merged.bin
          ls -l build/doormutex.bin build/doormutex-esp32c6-merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: doormutex-firmware-esp32c6
          path: |
            firmware/build/doormutex.bin
            firmware/build/doormutex-esp32c6-merged.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
          if-no-files-found: error

  esphome:
    name: Firmware · ESPHome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate
        run: |
          cp firmware/esphome/secrets.example.yaml firmware/esphome/secrets.yaml
          docker run --rm -v "$PWD/firmware/esphome:/config" ghcr.io/esphome/esphome:2026.10.1 config doormutex-mains.yaml
