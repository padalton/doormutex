# Example: run the hub next to an existing MQTT broker.
#   cp config.example.yaml config.yaml   # adjust work hours and mqtt.url
#   docker compose -f compose.example.yaml up -d
#   docker compose -f compose.example.yaml exec hub doormutex-hub token create companion office
services:
  hub:
    image: ghcr.io/padalton/doormutex-hub:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DOORMUTEX_CONFIG: /config/config.yaml
      # DOORMUTEX_MQTT_PASSWORD: set via an .env file, never commit it
      DOORMUTEX_MQTT_PASSWORD: ${DOORMUTEX_MQTT_PASSWORD:-}
      # Key for the Google tokens in the database (openssl rand -base64 32).
      # Without it the hub creates /data/secret.key – then keep that file out
      # of the backups of /data/hub.db, or the encryption protects nothing.
      DOORMUTEX_SECRET_KEY: ${DOORMUTEX_SECRET_KEY:-}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - hub-data:/data

volumes:
  hub-data:
