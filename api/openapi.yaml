openapi: 3.1.0
info:
  title: doormutex hub API
  version: 0.1.0
  summary: Contract between the hub, the desktop companion, the Plasma widget and the Stream Deck plugin.
  description: |
    The hub decides the traffic light state from manual overrides, the
    desktop companion (microphone, camera, screen lock), the calendar,
    working hours and webhook signals. Clients read the state, follow
    changes via Server-Sent Events and set overrides.

    All endpoints except `/healthz` require a bearer token. Create one per
    client with `doormutex-hub token create <name> [<profile>]`.

    **Profiles:** one hub serves several people and lights (e.g. the
    office and a teenager's room). A token created for a profile only
    works for that profile and needs no further parameter. A token without
    a profile chooses one with the `profile` query parameter; without it,
    the first profile of the configuration is used.

    Durations are Go-style strings such as `30s`, `25m` or `1h30m`.
    Timestamps are RFC 3339.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: healthz
      security: []
      responses:
        "200":
          description: The hub is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /api/v1/profiles:
    get:
      summary: Profiles and their current state
      description: All profiles for an unscoped token, only its own profile for a scoped one.
      operationId: listProfiles
      responses:
        "200":
          description: Profiles in configuration order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/history:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    get:
      summary: Recent status changes
      operationId: getHistory
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HistoryEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownProfile" }

  /api/v1/calendar:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    get:
      summary: Calendar connection status
      description: Provider and, for Google, the health of every connected account (no event data).
      operationId: getCalendar
      responses:
        "200":
          description: Calendar status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/settings:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    get:
      summary: Runtime settings
      description: Light per calendar event kind and the timing of the warning phases. Saved settings override the config file.
      operationId: getSettings
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Change runtime settings
      description: Omitted fields stay as they are.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
            examples:
              focusRed: { value: { calendar: { focus: dnd } } }
              realWarning: { value: { last_call: 5m } }
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/message:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    put:
      summary: Set the e-ink message
      description: One line, at most 64 characters. An empty text clears it. Without `ttl` it stays until changed.
      operationId: setMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageRequest" }
            examples:
              gaming: { value: { text: "Gaming until 21:00", ttl: 3h } }
      responses:
        "200": { $ref: "#/components/responses/State" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Clear the e-ink message
      operationId: clearMessage
      responses:
        "200": { $ref: "#/components/responses/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/status:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    get:
      summary: Current state
      operationId: getStatus
      responses:
        "200":
          description: Current state including reason, slot and next free slot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/timeline:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    get:
      summary: Planned slots
      description: |
        Slots planned from calendar, working hours, pomodoro timer and
        overrides. Live signals (microphone, screen lock, webhooks) are not
        part of the plan.
      operationId: getTimeline
      parameters:
        - name: from
          in: query
          description: Start (default now).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End (default from + 24 h, at most 14 days after from).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Planned slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/override:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    put:
      summary: Set a manual status
      description: |
        Replaces a running pomodoro timer. Every override ends unless mode is
        `indefinite`. Microphone/camera and a locked PC beat an override; it
        applies again afterwards while it is still valid.
      operationId: setOverride
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideRequest" }
            examples:
              thirtyMinutes: { value: { status: dnd, mode: duration, duration: 30m } }
              untilEndOfWorkday: { value: { status: working, mode: end_of_workday } }
      responses:
        "200": { $ref: "#/components/responses/State" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The mode does not apply right now (no running event, outside working hours).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Back to automatic
      operationId: clearOverride
      responses:
        "200": { $ref: "#/components/responses/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/pomodoro:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    put:
      summary: Start a pomodoro timer
      description: Replaces a running override. Work phases show `work_status` (default `dnd`), breaks show `free`.
      operationId: startPomodoro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PomodoroRequest" }
      responses:
        "200": { $ref: "#/components/responses/State" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Stop the pomodoro timer
      operationId: stopPomodoro
      responses:
        "200": { $ref: "#/components/responses/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/signals/companion:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    post:
      summary: Companion heartbeat
      description: |
        Sent by the desktop companion every 30 s and on every change.
        Before shutdown or suspend it signs off with `goodbye`; the light
        goes off. If heartbeats stop for 90 s *without* a goodbye, that is
        a fault (phase `fault`, blinking yellow) until the end of the work
        day, then `away`. Microphone/camera count after 10 s of activity and
        hold for 2 min.
      operationId: companionHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanionSignal" }
      responses:
        "200": { $ref: "#/components/responses/State" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/signals/{source}:
    parameters:
      - $ref: "#/components/parameters/Profile"
      - name: source
        in: path
        required: true
        description: Signal name, e.g. `claude`. Lowercase, `[a-z0-9_-]`, up to 32 characters; `companion` is reserved.
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,31}$" }
    post:
      summary: Set a webhook signal
      description: A claim with priority 6 that expires after `ttl`. Sending again refreshes it.
      operationId: setSignal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalRequest" }
            example: { status: working, ttl: 30m }
      responses:
        "200": { $ref: "#/components/responses/State" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Remove a webhook signal
      operationId: clearSignal
      responses:
        "200": { $ref: "#/components/responses/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/events:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    get:
      summary: Live state stream (Server-Sent Events)
      description: |
        Sends `event: state` with a State JSON on connect and on every
        change, plus a keep-alive comment every 25 s. Browsers cannot set
        headers on EventSource, so the token may also be passed as
        `access_token` query parameter.
      operationId: streamEvents
      parameters:
        - name: access_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  responses:
    State:
      description: The state after the change.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/State" }
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The token is limited to another profile.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnknownProfile:
      description: No profile with this id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  parameters:
    Profile:
      name: profile
      in: query
      description: Profile id. Ignored for profile-scoped tokens unless it names another profile (then 403).
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }

  schemas:
    Status:
      type: string
      enum: [free, working, dnd, away]
      description: "free = green, working = yellow, dnd = red, away = off"
    Phase:
      type: string
      enum: [normal, last_call, amber, ending_soon, fault]
      description: |
        `last_call`: a meeting starts soon (green blinks from free, red/yellow
        alternate from working). `amber`: yellow shows ≈3 s before red.
        `ending_soon`: red+yellow before a meeting ends. `fault`: the
        companion went silent without signing off. Timing: StVO seconds by
        default, or a configured lead time.
    Light:
      type: string
      enum: [off, red, yellow, green, green_blink, red_yellow, red_yellow_alternate, yellow_blink]
      description: Lamp pattern. `yellow_blink` means fault; the device also falls back to it on its own when the hub is gone.
    Reason:
      type: string
      enum: [override, pomodoro, pomodoro_break, microphone, camera, screen_locked, pc_off, companion_lost, companion_offline, calendar, work_hours, signal, default]

    State:
      type: object
      required: [status, phase, light, reason, since, until, next, next_free, updated]
      properties:
        status: { $ref: "#/components/schemas/Status" }
        phase: { $ref: "#/components/schemas/Phase" }
        light: { $ref: "#/components/schemas/Light" }
        reason: { $ref: "#/components/schemas/Reason" }
        detail:
          type: string
          description: Extra context, e.g. app names for microphone/camera, event kind for calendar, signal name. Never an event title.
        since: { type: string, format: date-time, description: Start of the current slot. }
        until:
          type: [string, "null"]
          format: date-time
          description: End of the current slot; null if unknown (e.g. a call without calendar entry, a locked screen).
        next:
          oneOf:
            - $ref: "#/components/schemas/Slot"
            - type: "null"
          description: The slot after the current one; null if the current end is unknown.
        next_free:
          oneOf:
            - $ref: "#/components/schemas/FreeSlot"
            - type: "null"
          description: The current slot if it is free, otherwise the next free one; null if unknown.
        override:
          oneOf:
            - $ref: "#/components/schemas/Override"
            - type: "null"
          description: The active manual status; null in automatic mode.
        pomodoro:
          oneOf:
            - $ref: "#/components/schemas/Pomodoro"
            - type: "null"
          description: The running pomodoro timer; null if none.
        message:
          type: string
          description: Short text for the e-ink, set by people (web UI, HA). Omitted when empty.
        updated: { type: string, format: date-time }
      example:
        status: dnd
        phase: ending_soon
        light: red_yellow
        reason: calendar
        detail: video_call
        since: "2026-10-28T14:00:00+01:00"
        until: "2026-10-28T14:30:00+01:00"
        next: { status: working, reason: work_hours, since: "2026-10-28T14:30:00+01:00", until: "2026-10-28T17:00:00+01:00" }
        next_free: { start: "2026-10-28T17:00:00+01:00", end: "2026-10-29T08:00:00+01:00" }
        override: null
        pomodoro: null
        updated: "2026-10-28T14:25:03+01:00"

    Override:
      type: object
      required: [status, start]
      properties:
        status: { $ref: "#/components/schemas/Status" }
        start: { type: string, format: date-time }
        until: { type: string, format: date-time, description: Omitted if indefinite. }

    Pomodoro:
      type: object
      required: [start, work, break, cycles, work_status, end]
      properties:
        start: { type: string, format: date-time }
        work: { type: string, examples: [25m0s] }
        break: { type: string, examples: [5m0s] }
        cycles: { type: integer, description: "0 = until stopped" }
        work_status: { type: string, enum: [working, dnd] }
        end: { type: [string, "null"], format: date-time }

    ProfileInfo:
      type: object
      required: [id, name, mode, state]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { type: string, enum: [office, room] }
        state: { $ref: "#/components/schemas/State" }

    HistoryEntry:
      type: object
      required: [at, status, reason]
      properties:
        at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/Status" }
        reason: { $ref: "#/components/schemas/Reason" }
        detail: { type: string }

    CalendarInfo:
      type: object
      required: [provider, accounts]
      properties:
        provider: { type: string, enum: [none, google, fake] }
        accounts:
          type: array
          items:
            type: object
            required: [name, connected, events]
            properties:
              name: { type: string, examples: [private, work] }
              connected: { type: boolean, description: "false until someone ran `doormutex-hub google login`" }
              last_sync: { type: string, format: date-time }
              events: { type: integer, description: Events in the planning window at the last sync. }
              error: { type: string }

    Lead:
      type: string
      description: "`stvo` (seconds, like on the road) or a lead time from 1s to 1h."
      examples: [stvo, 5m]

    Settings:
      type: object
      additionalProperties: false
      properties:
        calendar:
          type: object
          description: Status per event kind, or `ignore`.
          propertyNames: { enum: [video_call, focus, out_of_office, other] }
          additionalProperties: { type: string, enum: [free, working, dnd, away, ignore] }
        last_call: { $ref: "#/components/schemas/Lead" }
        ending_soon: { $ref: "#/components/schemas/Lead" }

    MessageRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 64 }
        ttl: { type: string, description: "0 to 7 days; omitted = until changed", examples: [3h] }

    Slot:
      type: object
      required: [status, since, until]
      properties:
        status: { $ref: "#/components/schemas/Status" }
        reason: { $ref: "#/components/schemas/Reason" }
        since: { type: string, format: date-time }
        until: { type: [string, "null"], format: date-time }

    FreeSlot:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time }
        end: { type: [string, "null"], format: date-time }

    Timeline:
      type: object
      required: [from, to, slots]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }

    OverrideRequest:
      type: object
      required: [status, mode]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/Status" }
        mode:
          type: string
          enum: [duration, until, end_of_event, end_of_workday, indefinite]
        duration:
          type: string
          description: Required for mode `duration`, 1s to 7 days.
          examples: [15m, 1h]
        until:
          type: string
          format: date-time
          description: Required for mode `until`.

    PomodoroRequest:
      type: object
      additionalProperties: false
      properties:
        work: { type: string, default: 25m, description: "1m to 4h" }
        break: { type: string, default: 5m, description: "0 to 1h" }
        cycles: { type: integer, minimum: 0, maximum: 24, default: 4, description: "0 = until stopped" }
        work_status:
          type: string
          enum: [working, dnd]
          default: dnd

    Media:
      type: object
      additionalProperties: false
      properties:
        active: { type: boolean }
        apps:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 64 }
          description: Apps using the device, e.g. `Firefox`. Shown in notifications and the state detail.

    CompanionSignal:
      type: object
      additionalProperties: false
      properties:
        locked: { type: boolean }
        microphone: { $ref: "#/components/schemas/Media" }
        camera: { $ref: "#/components/schemas/Media" }
        goodbye:
          type: string
          enum: [shutdown, suspend]
          description: The companion signs off; silence after this is expected and the light goes off.

    SignalRequest:
      type: object
      required: [status, ttl]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/Status" }
        ttl: { type: string, description: "1s to 24h", examples: [30m] }
        detail: { type: string, maxLength: 64 }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
